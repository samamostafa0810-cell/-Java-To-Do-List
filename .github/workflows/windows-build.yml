name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Download JavaFX
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://download2.gluonhq.com/openjfx/24.0.2/openjfx-24.0.2_windows-x64_bin-sdk.zip" `
            -OutFile "javafx.zip"
          Expand-Archive "javafx.zip" -DestinationPath "."
          Rename-Item "javafx-sdk-24.0.2" "javafx"

      - name: Build
        shell: cmd
        run: |
          ant clean jar

      - name: Package Windows App
        shell: cmd
        run: |
          jpackage ^
            --type app-image ^
            --name Todolist ^
            --input dist ^
            --main-jar Todolist.jar ^
            --main-class GUI ^
            --module-path javafx/lib ^
            --add-modules javafx.controls,javafx.fxml ^
            --dest output

      - name: Zip Windows App
        shell: powershell
        run: |
          Compress-Archive -Path "output\Todolist" -DestinationPath "Todolist-Windows.zip"

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: Todolist-Windows
          path: Todolist-Windows.zip
